<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Không Tìm Thấy Trang</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f7f9fa;
            color: #333;
            text-align: center;
            padding: 50px;
            margin: 0;
        }
        .container {
            max-width: 600px;
            margin: 50px auto;
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h1 {
            font-size: 80px;
            margin: 0;
            color: #ff4757;
        }
        h2 {
            font-size: 24px;
            margin: 15px 0;
            color: #2f3542;
        }
        p {
            font-size: 16px;
            color: #747d8c;
            line-height: 1.6;
        }
        a {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 24px;
            background-color: #2ed573;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: background 0.2s;
        }
        a:hover {
            background-color: #26af5f;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>404</h1>
        <h2>Oops! Không tìm thấy trang</h2>
        <p>Đường dẫn bạn yêu cầu truy cập không tồn tại hoặc đã bị di dời sang địa chỉ khác.</p>
        <a href="/">Quay lại Trang Chủ</a>
    </div>
</body>
</html>
